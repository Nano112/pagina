# pagina's documentation, built with pagina and deployed to GitHub Pages.
#
# The article is `docs/`, and the toolchain that renders it is this same checkout — so the site is
# always built by the commit it documents. There is nothing to clone but Kineglyph, which supplies
# the figure engine and is not published to npm yet.
#
# Action versions are pinned by commit SHA. A tag is a moving target that someone else controls,
# and this workflow is handed a `GITHUB_TOKEN` that can publish.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/**"
      - "tools/build-docs-site.sh"
      - ".github/workflows/docs.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "docs/**"
      - "packages/**"
      - "tools/build-docs-site.sh"
      - ".github/workflows/docs.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  # The deployment URL, path and all. `tools/build-docs-site.sh` derives `--base` from it, so the
  # sub-path is stated once and the canonical and the asset URLs cannot disagree.
  PAGINA_SITE_URL: https://nano112.github.io/pagina/

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `configure-pages` needs these to create the Pages site on the first run. Without it, the
      # very first deploy of a repository that has never published Pages fails on a site that does
      # not exist yet.
      pages: write
      id-token: write
    steps:
      - name: Check out pagina
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pagina

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pagina/package-lock.json

      # The figure engine is pinned by the lockfile now that it is published, which is a stronger
      # guarantee than the SHA this used to clone: the lockfile pins what every install resolves,
      # including a reader's. The old pin shadowed it, so the site could be drawn by a Kineglyph
      # nobody else could obtain.
      - name: Install and build pagina
        working-directory: pagina
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build the documentation site
        working-directory: pagina
        run: tools/build-docs-site.sh "$GITHUB_WORKSPACE/site"

      - name: Upload the article bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pagina-docs-bundle
          path: ${{ github.workspace }}/site.pgz
          if-no-files-found: error
          retention-days: 30

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ github.workspace }}/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
